[package]
name = "ai-rdvd"
version = "0.1.0"
description = "AI RDvD desktop application"
authors = ["AI RDvD"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "ai_rdvd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
